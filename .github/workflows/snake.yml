name: Generate GitHub contribution snake

on:
  # Refresh the animation daily.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

  # Also generate the animation after README/workflow changes on main.
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vd63866
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish animation to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
